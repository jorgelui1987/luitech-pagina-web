<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador | Luitech</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="stylesheet" href="assets/css/styles.css?v=mp30">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 px-4 w-full sm:w-auto items-end pointer-events-none"></div>

    <div id="view-nologin" class="hidden min-h-screen flex items-center justify-center p-6 text-center">
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-8 max-w-sm">
            <i class="fa-solid fa-lock text-amber-400 text-3xl mb-4"></i>
            <h1 class="font-extrabold text-white text-lg">Sesión requerida</h1>
            <p class="text-slate-400 text-xs mt-2">Inicia sesión en el panel del taller para usar el cotizador.</p>
            <a href="admin.html" class="inline-block mt-5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm">Ir al Login</a>
        </div>
    </div>

    <main id="view-cot" class="hidden max-w-3xl mx-auto px-4 pb-10">
        <header class="flex flex-wrap justify-between items-center gap-3 bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 mt-4 mb-4">
            <div class="flex items-center gap-3">
                <img src="assets/img/logo-luitech.png" alt="" width="36" height="36" class="h-9 w-9 rounded-lg object-cover">
                <span class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-500">COTIZADOR</span>
            </div>
            <nav class="flex flex-wrap items-center gap-3 text-xs font-semibold">
                <a href="proveedores.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">Proveedores</a>
                <a href="admin.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">Panel</a>
            </nav>
        </header>

        <!-- Buscador: protagonista absoluto, sticky -->
        <div style="position:sticky; top:0; z-index:30; background:#0f172a; margin:0 -4px 10px; padding:8px 4px;">
            <label for="cot-buscar" class="sr-only">Buscar pieza o modelo</label>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-emerald-500"></i>
                <input type="text" id="cot-buscar" autocomplete="off" placeholder="¿Qué busca el cliente? (ej: pantalla iphone 13)"
                       class="w-full bg-slate-950 border border-slate-700 rounded-2xl pl-11 pr-4 py-4 text-base font-semibold text-white focus:outline-none focus:border-emerald-500">
            </div>
            <p id="cot-estado" class="text-[11px] font-bold text-emerald-400 mt-1.5 ml-2"></p>
        </div>

        <div id="cot-resultados" class="space-y-4"></div>

        <!-- Barra total de la cotización (aparece al agregar cantidades) -->
        <div id="cot-total" class="hidden" style="position:sticky; bottom:0; z-index:30; background:#0f172a; margin:10px -4px 0; padding:10px 4px; border-top:1px solid #1e293b;">
            <div class="flex items-center gap-3">
                <div class="flex-1">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Total cotización</p>
                    <p class="text-xl font-black text-emerald-400" id="cot-total-monto">$ 0</p>
                </div>
                <button type="button" id="btn-cot-limpiar" title="Quitar todo" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-red-900 text-slate-300 transition-all"><i class="fa-solid fa-trash-can"></i></button>
                <button type="button" id="btn-cot-imprimir" class="px-4 h-11 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-sm transition-all"><i class="fa-solid fa-print mr-1"></i>Imprimir</button>
            </div>
        </div>
    </main>

    <script src="assets/js/common.js?v=mp30" defer></script>
    <script src="assets/js/cotizador.js?v=mp30" defer></script>
</body>
</html>
