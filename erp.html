<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión ERP | Luitech</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

<body class="bg-slate-900 text-slate-100 min-h-screen overflow-x-hidden">
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 px-4 w-full sm:w-auto items-end pointer-events-none"></div>

    <div class="flex min-h-screen">
        <aside id="sidebar" class="w-56 flex-shrink-0 bg-slate-950 border-r border-slate-800 p-4 hidden md:flex md:flex-col sticky top-0 self-start h-screen"></aside>

        <main id="contenedor" class="flex-grow px-3 py-5 space-y-4 overflow-x-hidden">
            <h1 class="text-xl font-black text-white"><i class="fa-solid fa-layer-group text-cyan-400 mr-2"></i>Gestión ERP</h1>

            <!-- Pestañas -->
            <nav id="tab-btns" class="flex flex-wrap gap-2"></nav>

            <!-- Formulario dinámico -->
            <section id="tab-form" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4"></section>

            <!-- Contenido del tab -->
            <section id="tab-body" class="bg-slate-950 border border-slate-800 rounded-xl p-4 min-h-[300px]"></section>
        </main>
    </div>

    <script src="assets/js/common.js" defer></script>
    <script src="assets/js/shell.js" defer></script>
    <script src="assets/js/erp.js" defer></script>

</html>
