<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Luitech</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="stylesheet" href="assets/css/styles.css?v=mp18">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 px-4 w-full sm:w-auto items-end pointer-events-none"></div>

    <div id="view-nologin" class="hidden min-h-screen flex items-center justify-center p-6 text-center">
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-8 max-w-sm">
            <i class="fa-solid fa-lock text-amber-400 text-3xl mb-4"></i>
            <h1 class="font-extrabold text-white text-lg">Sesión requerida</h1>
            <a href="admin.html" class="inline-block mt-5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm">Ir al Login</a>
        </div>
    </div>

    <main id="view-inv" class="hidden max-w-7xl mx-auto px-4 py-6 space-y-5">

        <header class="flex flex-wrap justify-between items-center gap-3 bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4">
            <div class="flex items-center gap-3">
                <img src="assets/img/logo-luitech.png" alt="" width="36" height="36" class="h-9 w-9 rounded-lg object-cover">
                <span class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">INVENTARIO</span>
            </div>
            <nav class="flex flex-wrap items-center gap-3 text-xs font-semibold">
                <a href="pos.html" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-cash-register mr-1"></i>Ir al POS</a>
                <a href="proveedores.html" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-truck-field mr-1"></i>Proveedores</a>
                <a href="admin.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">Panel</a>
            </nav>
        </header>

        <!-- Formulario crear/editar -->
        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-5">
            <h2 id="form-titulo" class="text-sm font-bold text-cyan-400 mb-3"><i class="fa-solid fa-plus mr-1"></i>Nuevo producto</h2>
            <input type="hidden" id="p-id">
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-2.5 text-xs">
                <input type="text" id="p-codigo" placeholder="Código*" maxlength="30" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                <input type="text" id="p-nombre" placeholder="Nombre*" maxlength="120" class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                <input type="text" id="p-cat" placeholder="Categoría" maxlength="60" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                <select id="p-prov" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"><option value="">— Proveedor —</option></select>
                <input type="number" id="p-costo" min="0" placeholder="Costo $" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                <input type="number" id="p-venta" min="0" placeholder="Venta $*" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                <input type="number" id="p-stock" min="0" placeholder="Stock" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                <input type="number" id="p-min" min="0" placeholder="Mínimo" value="3" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                <label class="flex items-center gap-2 text-slate-400 col-span-2"><input type="checkbox" id="p-ctrl" checked class="accent-cyan-500">Controlar stock (desmarcar para servicios)</label>
                <button type="button" id="btn-guardar" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg py-2">Guardar</button>
                <button type="button" id="btn-cancelar" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-lg py-2">Cancelar</button>
            </div>
        </section>

        <!-- Alerta de stock bajo -->
        <section id="alertas-stock" class="hidden bg-red-950/40 border border-red-900/60 rounded-xl p-4 text-xs text-red-300"></section>

        <!-- Tabla -->
        <section class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm min-w-[820px]">
                    <thead class="bg-slate-900/80 border-b border-slate-800 text-[11px] uppercase tracking-wider text-slate-400">
                        <tr>
                            <th scope="col" class="p-3">Código</th><th scope="col" class="p-3">Nombre</th>
                            <th scope="col" class="p-3">Categoría</th><th scope="col" class="p-3">Proveedor</th><th scope="col" class="p-3 text-right">Costo</th>
                            <th scope="col" class="p-3 text-right">Venta</th><th scope="col" class="p-3 text-center">Stock</th>
                            <th scope="col" class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inv-body" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="assets/js/common.js?v=mp18" defer></script>
    <script src="assets/js/inventario.js?v=mp18" defer></script>
</body>
</html>
