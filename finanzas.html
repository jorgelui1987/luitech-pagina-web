<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas | Luitech</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="stylesheet" href="assets/css/styles.css?v=mp36">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        /* Acordeón de gastos: animación con grid-rows (soporta tablas largas) */
        .gastos-cuerpo{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease; }
        .gastos-cuerpo > div{ overflow:hidden; min-height:0; }
        .gastos-cuerpo.abierto{ grid-template-rows:1fr; }
        #gastos-chevron{ transition:transform .25s ease; }
        #gastos-chevron.abierto{ transform:rotate(180deg); }
    </style>
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 px-4 w-full sm:w-auto items-end pointer-events-none"></div>

    <div id="view-nologin" class="hidden min-h-screen flex items-center justify-center p-6 text-center">
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-8 max-w-sm">
            <i class="fa-solid fa-lock text-amber-400 text-3xl mb-4"></i>
            <h1 class="font-extrabold text-white text-lg">Sesión requerida</h1>
            <a href="admin.html" class="inline-block mt-5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm">Ir al Login</a>
        </div>
    </div>

    <main id="view-fin" class="hidden max-w-6xl mx-auto px-4 py-6 space-y-5">

        <header class="flex flex-wrap justify-between items-center gap-3 bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4">
            <div class="flex items-center gap-3">
                <img src="assets/img/logo-luitech.png" alt="" width="36" height="36" class="h-9 w-9 rounded-lg object-cover">
                <span class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">FINANZAS</span>
            </div>
            <nav class="flex flex-wrap items-center gap-3 text-xs font-semibold">
                <a href="pos.html" rel="noopener" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg">POS</a>
                <a href="inventario.html" rel="noopener" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg">Inventario</a>
                <a href="admin.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">Panel</a>
            </nav>
        </header>

        <!-- ============ CAJA DEL DÍA ============ -->
        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4">
            <h2 class="font-extrabold text-white"><i class="fa-solid fa-cash-register text-emerald-400 mr-2"></i>Caja del día</h2>

            <!-- Estado: cerrada -->
            <div id="caja-cerrada" class="flex flex-wrap items-end gap-3">
                <p class="text-sm text-slate-400 basis-full">No hay caja abierta. Ábrela para que las ventas en efectivo queden registradas en gaveta.</p>
                <label for="caja-apertura-monto" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Monto inicial $</label>
                <input type="number" id="caja-apertura-monto" min="0" value="0"
                       class="w-40 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                <button type="button" id="btn-abrir-caja" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-2 rounded-lg"><i class="fa-solid fa-play mr-1"></i>Abrir caja</button>
            </div>

            <!-- Estado: abierta -->
            <div id="caja-abierta" class="hidden space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                        <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Apertura</p>
                        <p class="text-xl font-black text-slate-200">$<span id="caja-apertura">0</span></p>
                    </div>
                    <div class="bg-emerald-950/50 border border-emerald-800/60 rounded-xl p-4 text-center">
                        <p class="text-[10px] uppercase tracking-wider text-emerald-300 font-bold">Efectivo esperado</p>
                        <p class="text-2xl font-black text-emerald-400">$<span id="caja-esperado">0</span></p>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                        <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Abierta por</p>
                        <p class="text-sm font-bold text-slate-300 mt-1" id="caja-quien">—</p>
                        <p class="text-[10px] text-slate-500" id="caja-desde"></p>
                    </div>
                </div>

                <!-- Movimiento manual -->
                <form id="form-mov" class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-xs">
                    <select id="mov-tipo" class="sm:col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                        <option value="Ingreso">+ Ingreso a gaveta</option>
                        <option value="Egreso">− Retiro de gaveta</option>
                    </select>
                    <input type="text" id="mov-concepto" maxlength="150" placeholder="Concepto*" required
                           class="sm:col-span-4 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    <input type="number" id="mov-monto" min="1" placeholder="Monto*" required
                           class="sm:col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    <button type="submit" class="sm:col-span-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg py-2">Registrar</button>
                </form>

                <div id="mov-lista" class="space-y-1.5 max-h-52 overflow-y-auto pr-1"></div>

                <div class="flex flex-wrap items-end gap-3 pt-3 border-t border-slate-800">
                    <label for="caja-contado" class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-auto">Dinero contado al cerrar $</label>
                    <input type="number" id="caja-contado" min="0" class="w-36 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                    <button type="button" id="btn-cerrar-caja" class="bg-red-600 hover:bg-red-500 text-white font-bold px-5 py-2 rounded-lg"><i class="fa-solid fa-stop mr-1"></i>Cerrar caja y cuadrar</button>
                </div>
            </div>
        </section>

        <!-- ============ REPORTE MENSUAL ============ -->
        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h2 class="font-extrabold text-white"><i class="fa-solid fa-chart-line text-cyan-400 mr-2"></i>Reporte mensual</h2>
                <div class="flex items-center gap-2 text-sm font-bold">
                    <button type="button" id="btn-reporte-print" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-3 py-2 rounded-lg" title="Imprimir o guardar como PDF"><i class="fa-solid fa-print mr-1"></i>Imprimir reporte</button>
                    <button type="button" id="mes-prev" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">&lsaquo;</button>
                    <span id="mes-label" class="px-2 text-white uppercase tracking-wide text-xs">—</span>
                    <button type="button" id="mes-next" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">&rsaquo;</button>
                </div>
            </div>

        <!-- ============ GASTOS DEL NEGOCIO (acordeón) ============ -->
        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-5">
            <button type="button" id="btn-gastos-toggle" class="w-full flex items-center justify-between gap-3 text-left" aria-expanded="false" aria-controls="gastos-cuerpo">
                <h2 class="font-extrabold text-white"><i class="fa-solid fa-receipt text-red-400 mr-2"></i>Gastos del negocio</h2>
                <span class="flex items-center gap-3">
                    <span id="gastos-barra" class="text-xs font-bold text-red-300">—</span>
                    <i id="gastos-chevron" class="fa-solid fa-chevron-down text-slate-500"></i>
                </span>
            </button>
            <div id="gastos-cuerpo" class="gastos-cuerpo">
                <div>
                    <div class="space-y-4 pt-4">
                        <form id="form-gasto" class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-xs">
                            <input type="hidden" id="g-id">
                            <input type="text" id="g-concepto" maxlength="150" placeholder="Concepto*" required
                                   class="sm:col-span-4 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                            <input type="text" id="g-cat" maxlength="60" placeholder="Categoría (ej. Mercadería, Arriendo)"
                                   class="sm:col-span-3 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                            <input type="number" id="g-monto" min="1" placeholder="Monto*" required
                                   class="sm:col-span-2 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                            <input type="date" id="g-fecha"
                                   class="sm:col-span-1 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-red-500">
                            <button type="submit" id="btn-gasto" class="sm:col-span-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg py-2">Registrar gasto</button>
                        </form>

                        <div class="flex flex-wrap gap-2 items-center text-xs">
                            <input type="text" id="gastos-buscar" placeholder="Buscar gasto (concepto o categoría)..."
                                   class="flex-grow min-w-[180px] bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                            <select id="gastos-filtro-cat" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
                                <option value="">Todas las categorías</option>
                            </select>
                        </div>

                        <div id="gastos-tabla-wrap" class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-900/80 border-b border-slate-800 text-[11px] uppercase tracking-wider text-slate-400">
                                    <tr><th class="p-2.5">Fecha</th><th class="p-2.5">Concepto</th><th class="p-2.5">Categoría</th><th class="p-2.5 text-right">Monto</th><th class="p-2.5 text-center"></th></tr>
                                </thead>
                                <tbody id="gastos-body" class="divide-y divide-slate-800/50"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/common.js?v=mp36" defer></script>
    <script src="assets/js/finanzas.js?v=mp36" defer></script>
</body>
</html>
