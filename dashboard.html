<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Luitech</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=4">
    <link rel="stylesheet" href="assets/css/styles.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 px-4 w-full sm:w-auto items-end pointer-events-none"></div>

    <div class="flex min-h-screen">
        <aside id="sidebar" class="w-56 flex-shrink-0 bg-slate-950 border-r border-slate-800 p-4 hidden md:flex md:flex-col sticky top-0 self-start h-screen"></aside>

        <main id="contenedor" class="flex-grow px-4 py-5 space-y-5 overflow-x-hidden">
            <h1 class="text-2xl font-black text-white"><i class="fa-solid fa-gauge-high text-cyan-400 mr-2"></i>Dashboard</h1>

            <!-- Tarjetas resumen -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Ventas hoy</p>
                    <p class="text-2xl font-black text-white">$<span id="m-ventas-hoy">0</span></p>
                    <p class="text-[10px] text-slate-500"><span id="m-nventas">0</span> transacciones</p>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Ventas del mes</p>
                    <p class="text-2xl font-black text-emerald-400">$<span id="m-ventas-mes">0</span></p>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Gastos del mes</p>
                    <p class="text-2xl font-black text-red-400">$<span id="m-gastos-mes">0</span></p>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Órdenes activas</p>
                    <p class="text-2xl font-black text-cyan-400"><span id="m-ordenes-total">0</span></p>
                </div>
            </div>

            <!-- Órdenes por estado + Top productos -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                <section class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Órdenes por estado</h2>
                    <div id="ord-lista" class="space-y-2"></div>
                </section>
                <section class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Top productos del mes</h2>
                    <div id="top-productos" class="space-y-2"></div>
                </section>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                <section class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400"><i class="fa-solid fa-triangle-exclamation text-red-400 mr-1"></i>Stock bajo (<span id="m-bajo-n">0</span>)</h2>
                    <ul id="stock-bajo" class="text-xs text-slate-300 space-y-1"></ul>
                </section>
                <section class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400"><i class="fa-solid fa-shield-halved text-cyan-400 mr-1"></i>Garantías por vencer (14 días)</h2>
                    <ul id="gar-proximas" class="text-xs text-slate-300 space-y-1"></ul>
                </section>
            </div>
        </main>
    </div>

    <script src="assets/js/common.js" defer></script>
    <script src="assets/js/shell.js" defer></script>
    <script src="assets/js/dashboard.js" defer></script>
</body>
</html>
